[project]
name = "metodos-numericos"
version = "0.1.0"
description = "Métodos numéricos del Taller de Métodos Numéricos, con una GUI unificada en Tkinter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[project.gui-scripts]
metodos-numericos = "metodos_numericos.app:iniciar_gui"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
